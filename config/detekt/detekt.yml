# Дополняет дефолтный конфиг detekt (buildUponDefaultConfig = true).
# Дефолтные исключения тестовых source sets detekt не знают про androidHostTest (unit-тесты KMP-модулей):
# повторяем их список с ним для всех активных правил, где они есть.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    excludes: &testSources ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/androidHostTest/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    excludes: *testSources

exceptions:
  InstanceOfCheckForException:
    excludes: *testSources
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: *testSources
  TooGenericExceptionCaught:
    excludes: *testSources

performance:
  ForEachOnRange:
    excludes: *testSources
  SpreadOperator:
    excludes: *testSources

potential-bugs:
  UnsafeCallOnNullableType:
    excludes: *testSources

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    # theme — токены, illustration — координаты SVG-рисунков из макета (питомец, уголок).
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**', '**/androidHostTest/**', '**/theme/**', '**/illustration/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  WildcardImport:
    active: true
  ForbiddenComment:
    # TODO разрешены: каркас намеренно оставляет места для доработки. FIXME/STOPSHIP — нет.
    comments: ['FIXME:', 'STOPSHIP:']
